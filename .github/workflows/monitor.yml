name: Monitor faculty recruitment pages

on:
  schedule:
    # Every 3 hours. Edit the cron expression to change frequency.
    # Cron is in UTC. Syntax: minute hour day month weekday
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # lets you manually trigger a run from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Run monitor script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: Rscript check_updates.R

      - name: Commit updated state
        run: |
          git config user.name "faculty-page-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.csv run_log.txt
          git diff --quiet --cached || git commit -m "Update state [skip ci]"
          git push
